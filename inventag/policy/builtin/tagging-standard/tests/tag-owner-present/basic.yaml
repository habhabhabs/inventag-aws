format_version: 1
kind: policy-test
name: tag-owner-present-basic
spec:
  policy: tag-owner-present
  now: '2026-11-20'
  resources:
  - service: S3
    resource_type: Bucket
    resource_id: b-good
    resource_name: b-good
    arn: arn:aws:s3:::b-good
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {Owner: team}
    raw_data: {Name: b}
  - service: S3
    resource_type: Bucket
    resource_id: b-bad
    resource_name: b-bad
    arn: arn:aws:s3:::b-bad
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {Environment: prod}
    raw_data: {Name: b}
  - service: S3
    resource_type: Bucket
    resource_id: b-none
    resource_name: b-none
    arn: arn:aws:s3:::b-none
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {}
    raw_data: {Name: b}
  - service: Billing
    resource_type: Service
    resource_id: svc
    resource_name: svc
    arn: arn:aws:billing:::svc
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {}
    source: billing
  - service: KMS
    resource_type: Alias
    resource_id: alias/x
    resource_name: alias/x
    arn: arn:aws:kms:us-east-1:111111111111:alias/x
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {}
  expect:
  - {resource: 'arn:aws:s3:::b-good', result: pass}
  - {resource: 'arn:aws:s3:::b-bad', result: fail}
  - {resource: 'arn:aws:s3:::b-none', result: fail}
  - {resource: 'arn:aws:billing:::svc', result: out_of_scope}
  - {resource: 'arn:aws:kms:us-east-1:111111111111:alias/x', result: out_of_scope}
