format_version: 1
kind: policy-test
name: tag-owner-present-tags-not-read
spec:
  policy: tag-owner-present
  now: '2026-11-20'
  units_not_read:
  - {account: '111111111111', service: resourcegroupstaggingapi, region: us-east-1, source: tagging-api,
    outcome: denied}
  resources:
  - service: S3
    resource_type: Bucket
    resource_id: b-good
    resource_name: b-good
    arn: arn:aws:s3:::b-good
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {Owner: team}
    raw_data: {Name: b}
  - service: S3
    resource_type: Bucket
    resource_id: b-none
    resource_name: b-none
    arn: arn:aws:s3:::b-none
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {}
    raw_data: {Name: b}
  expect:
  - {resource: 'arn:aws:s3:::b-good', result: not_evaluated, reason: tags_not_read}
  - {resource: 'arn:aws:s3:::b-none', result: not_evaluated, reason: tags_not_read}
  expect_units: []
