format_version: 1
kind: policy-test
name: security-group-not-open-basic
spec:
  policy: pub-security-group-not-open
  now: '2026-11-20'
  resources:
  - service: VPC
    resource_type: SecurityGroup
    resource_id: sg-closed
    resource_name: sg-closed
    arn: arn:aws:ec2:us-east-1:111111111111:security-group/sg-closed
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data:
      GroupId: sg-closed
      GroupName: sg-closed
      IpPermissions:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        IpRanges:
        - {CidrIp: 10.0.0.0/8}
        Ipv6Ranges: []
  - service: VPC
    resource_type: SecurityGroup
    resource_id: sg-v4
    resource_name: sg-v4
    arn: arn:aws:ec2:us-east-1:111111111111:security-group/sg-v4
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data:
      GroupId: sg-v4
      GroupName: sg-v4
      IpPermissions:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        IpRanges:
        - {CidrIp: 10.0.0.0/8}
        - {CidrIp: 0.0.0.0/0}
        Ipv6Ranges: []
  - service: VPC
    resource_type: SecurityGroup
    resource_id: sg-v6
    resource_name: sg-v6
    arn: arn:aws:ec2:us-east-1:111111111111:security-group/sg-v6
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data:
      GroupId: sg-v6
      GroupName: sg-v6
      IpPermissions:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        IpRanges: []
        Ipv6Ranges:
        - {CidrIpv6: '::/0'}
  - service: VPC
    resource_type: SecurityGroup
    resource_id: sg-empty
    resource_name: sg-empty
    arn: arn:aws:ec2:us-east-1:111111111111:security-group/sg-empty
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data:
      GroupId: sg-empty
      GroupName: sg-empty
      IpPermissions: []
  - service: RDS
    resource_type: DBInstance
    resource_id: db-a
    resource_name: db-a
    arn: arn:aws:rds:us-east-1:111111111111:db:db-a
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data: {PubliclyAccessible: false}
  expect:
  - {resource: 'arn:aws:ec2:us-east-1:111111111111:security-group/sg-closed', result: pass}
  - {resource: 'arn:aws:ec2:us-east-1:111111111111:security-group/sg-v4', result: fail}
  - {resource: 'arn:aws:ec2:us-east-1:111111111111:security-group/sg-v6', result: fail}
  - {resource: 'arn:aws:ec2:us-east-1:111111111111:security-group/sg-empty', result: pass}
  - {resource: 'arn:aws:rds:us-east-1:111111111111:db:db-a', result: out_of_scope}
