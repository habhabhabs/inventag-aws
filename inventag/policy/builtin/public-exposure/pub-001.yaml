# Reads only a field a moto scan shows on the row; see the tests of the set.
format_version: 1
kind: policy
name: pub-rds-not-public
description: "RDS instances are not publicly accessible"
spec:
  id: PUB-001
  severity: high
  version: 1
  resource: {services: [RDS], resource_types: [DBInstance], listings: [rds]}
  require: [raw_data.PubliclyAccessible]
  check:
    - {type: value, key: raw_data.PubliclyAccessible, value: false}
