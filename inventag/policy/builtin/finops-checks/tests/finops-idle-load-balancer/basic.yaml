format_version: 1
kind: policy-test
name: idle-load-balancer-basic
spec:
  policy: finops-idle-load-balancer
  now: '2026-11-20'
  resources:
  - service: ELBV2
    resource_type: LoadBalancerV2
    resource_id: web
    resource_name: web
    arn: arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/web/1
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data: {LoadBalancerArn: 'arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/web/1'}
  - service: ELBV2
    resource_type: LoadBalancerV2
    resource_id: old
    resource_name: old
    arn: arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/old/1
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data: {LoadBalancerArn: 'arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/old/1'}
  - service: ELB
    resource_type: LoadBalancer
    resource_id: classic-a
    resource_name: classic-a
    arn: arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/classic-a
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data:
      Instances: []
  - service: ELB
    resource_type: LoadBalancer
    resource_id: classic-b
    resource_name: classic-b
    arn: arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/classic-b
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data:
      Instances:
      - {InstanceId: i-0aaa}
  - service: ELBV2
    resource_type: TargetGroup
    resource_id: tg-web
    resource_name: tg-web
    arn: arn:aws:elasticloadbalancing:us-east-1:111111111111:targetgroup/tg-web/9
    region: us-east-1
    source_account_id: '111111111111'
    detail_level: full
    tags: {CostCenter: CC-1234, Owner: team, Project: p, Environment: prod}
    raw_data:
      LoadBalancerArns: ['arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/web/1']
  expect:
  - {resource: 'arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/web/1', result: pass}
  - {resource: 'arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/old/1', result: fail}
  - {resource: 'arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/classic-a', result: fail}
  - {resource: 'arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/classic-b', result: pass}
  - {resource: 'arn:aws:elasticloadbalancing:us-east-1:111111111111:targetgroup/tg-web/9', result: out_of_scope}
