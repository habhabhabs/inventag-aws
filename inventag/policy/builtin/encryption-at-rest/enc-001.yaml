# Reads only a field a moto scan shows on the row; see the tests of the set.
format_version: 1
kind: policy
name: enc-volume-encrypted
description: "EBS volumes are encrypted"
spec:
  id: ENC-001
  severity: medium
  version: 1
  resource: {services: [EC2], resource_types: [Volume], listings: [ec2]}
  require: [raw_data.Encrypted]
  check:
    - {type: value, key: raw_data.Encrypted, value: true}
