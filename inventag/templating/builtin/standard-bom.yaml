# Standard BOM: the layout most people start from.
# Excel: a Summary sheet, one sheet per service, readable column names and
# one column per tag key. Word: cover, summary, service counts, tag
# compliance (when a tag policy is active) and one table per service.
#
# Adapt it:   inventag templates init standard-bom --output .inventag/templates/my-bom.yaml
# Reference:  https://habhabhabs.github.io/inventag-aws/docs/templates/reference
format_version: 1
kind: report
name: standard-bom
description: Summary plus one sheet per service, with readable columns and every tag as a column.
spec:
  title: AWS Resource Inventory
  subtitle: Bill of materials generated by InvenTag
  colors:
    header_fill: "1F3A5F"   # dark blue; white text on it has a contrast ratio above 10:1
    header_text: "FFFFFF"
  columns:
    - { field: source_account_id, header: Account }
    - { field: region, header: Region }
    - { field: service, header: Service }
    - { field: resource_type, header: Type }
    - { field: resource_name, header: Name }
    - { field: resource_id, header: ID }
    - { field: arn, header: ARN }
  tag_columns: all          # one column per tag key found on the sheet
  excel:
    summary_sheet: true
    layout: per-service
    freeze_header: true
    autofilter: true
    max_column_width: 50
  word:
    orientation: portrait
    sections: [cover, summary, service-summary, tag-compliance, service-tables, about]
    columns:
      - { field: resource_name, header: Name }
      - { field: resource_type, header: Type }
      - { field: region, header: Region }
      - { field: source_account_id, header: Account }
      - { field: tags, header: Tags }
    max_rows_per_service: 50
