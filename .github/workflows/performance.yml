name: Weekly performance tests

# Weekly, and on demand. It never runs on a pull request or a push, gates no
# merge and never makes a release. Two jobs:
#
# Job `performance`: the performance tests (`-m performance`) are excluded
# from every other run (pytest.ini: -m "not performance and not slow"), so
# nothing else would notice the next quadratic code path. This job runs them,
# and the delta-detector scaling test next to them. The slow regression tests
# (`-m slow`, tests/regression) are excluded the same way and run here too.
#
# Job `benchmark` (plan v14, section 2.9): the numbers come from a simulated
# AWS (moto) with a fixed delay per request.
# Not verified against real AWS: any speed-up.
#
# Each case runs the baseline (a checkout of the tag) and the candidate (this
# commit) one after the other on the same runner, then compares the two JSON
# results. Only the ratio counts; absolute seconds are not a gate.
#
# Cases B5 and B6 (one request at a time; at most 8 in flight) and the check
# that the AWS calls equal those of v1.3.0 are deterministic and run in the
# normal test suite from v1.4.0, so they are not listed here.
"on":
  schedule:
    # Mondays at 03:17 UTC (a scheduled run uses the default branch)
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Tag or commit to compare with'
        required: false
        default: 'v1.3.0'
        type: string

permissions:
  contents: read

concurrency:
  group: performance
  cancel-in-progress: false

jobs:
  performance:
    name: Performance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install requirements
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # `-m performance` on the command line replaces the -m of pytest.ini.
    - name: Performance tests (-m performance)
      shell: bash
      run: python -m pytest -m performance -v --timeout=1800 tests/integration/test_performance_benchmarks.py

    # Counts the work done per changed row for growing inputs: it fails when
    # change detection grows faster than linearly (row A-40).
    - name: Delta detector scaling test
      shell: bash
      run: python -m pytest -v --timeout=600 tests/unit/test_delta_detector_scaling.py

    # `-m slow` replaces the -m of pytest.ini: the regression rows that need a
    # real child process or more than 30 seconds.
    - name: Slow regression tests (-m slow)
      shell: bash
      run: python -m pytest -m slow -v --timeout=900 tests/regression

  benchmark:
    name: Case ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        case: [B1, B2, B3, B4, B7, B8]

    steps:
    - name: Checkout the candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Checkout the baseline
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.baseline_ref || 'v1.3.0' }}
        path: baseline
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Measure the baseline
      env:
        CASE: ${{ matrix.case }}
      run: |
        python scripts/benchmark_scan.py --case "$CASE" --time-limit 900 \
          --inventag-root baseline --json "baseline-$CASE.json"

    - name: Measure the candidate
      env:
        CASE: ${{ matrix.case }}
      run: |
        python scripts/benchmark_scan.py --case "$CASE" --time-limit 900 \
          --json "candidate-$CASE.json"

    - name: Compare with the acceptance of plan section 2.9
      env:
        CASE: ${{ matrix.case }}
      run: |
        set -o pipefail
        python scripts/benchmark_scan.py --check-case "$CASE" \
          --baseline "baseline-$CASE.json" --candidate "candidate-$CASE.json" \
          | tee "check-$CASE.txt"
        {
          echo "### Case $CASE"
          echo '```'
          cat "check-$CASE.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: benchmark-${{ matrix.case }}
        path: |
          baseline-${{ matrix.case }}.json
          candidate-${{ matrix.case }}.json
          check-${{ matrix.case }}.txt
        if-no-files-found: warn
        retention-days: 90
