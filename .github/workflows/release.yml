name: Automated Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      publish_existing_tag:
        description: 'Only publish this existing release tag to PyPI (e.g. v1.0.0). Leave empty for a normal release. Ignores "Version bump type".'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# One release run at a time. A running release is never cancelled; GitHub keeps
# only the newest queued run, which is enough because a release covers every
# commit on main since the previous tag.
# Runs that can never release ([skip release] or [skip ci] pushes, and the manual
# publish-only run) get a group of their own: in the shared group they would
# replace a queued release run, and the commit of that run would not be released.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag != '') ||
    contains(github.event.head_commit.message, '[skip release]') ||
    contains(github.event.head_commit.message, '[skip ci]')) &&
    format('release-noop-{0}', github.run_id) || 'release-main' }}
  cancel-in-progress: false

jobs:
  check-for-release:
    name: Check if Release Needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version_bump: ${{ steps.check.outputs.version_bump }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Check for release triggers
      id: check
      run: |
        # Default to no release
        echo "should_release=false" >> $GITHUB_OUTPUT
        echo "version_bump=patch" >> $GITHUB_OUTPUT
        echo "pr_number=" >> $GITHUB_OUTPUT
        
        # Publish-only run: no new release, the publish-pypi job handles it
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_PUBLISH_TAG" ]; then
          echo "Publish-only run for $INPUT_PUBLISH_TAG: no release will be created"
          exit 0
        fi

        # Check if manual dispatch with version bump
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          case "$INPUT_VERSION_BUMP" in patch|minor|major) ;; *) echo "invalid bump"; exit 1;; esac
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version_bump=$INPUT_VERSION_BUMP" >> $GITHUB_OUTPUT
          echo "Manual release triggered with $INPUT_VERSION_BUMP bump"
          exit 0
        fi
        
        # Check if this is a merge to main
        if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          # Get the merged PR info from the commit message
          COMMIT_MSG=$(git log --format=%B -n 1 ${{ github.sha }})
          echo "Commit message: $COMMIT_MSG"

          # An earlier run releases from the tip of main, so it may already have
          # released this commit. Then there is nothing new to release.
          RELEASED_IN=$(git tag --contains "${{ github.sha }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | head -n 1 || true)
          if [ -n "$RELEASED_IN" ]; then
            echo "This commit is already part of $RELEASED_IN - no release triggered"
            exit 0
          fi
          
          # [skip release] wins over everything else, merge commits included
          # (their message carries the PR title).
          if echo "$COMMIT_MSG" | grep -qiE "\[skip (release|ci)\]"; then
            echo "Commit asks to skip the release - no release triggered"
          # Check if this is a merge commit from a PR
          elif echo "$COMMIT_MSG" | head -n 1 | grep -q "^Merge pull request #"; then
            # PR number from the first line only: the body may mention other #numbers
            PR_NUM=$(echo "$COMMIT_MSG" | head -n 1 | grep -o "#[0-9]\+" | head -n 1 | tr -d '#')
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
            
            # Get PR labels to determine version bump
            PR_LABELS=$(gh pr view $PR_NUM --json labels --jq '.labels[].name' || echo "")
            echo "PR Labels: $PR_LABELS"
            
            # Determine version bump from labels
            if echo "$PR_LABELS" | grep -q "release:major"; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_bump=major" >> $GITHUB_OUTPUT
              echo "Major release triggered by PR #$PR_NUM"
            elif echo "$PR_LABELS" | grep -q "release:minor"; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_bump=minor" >> $GITHUB_OUTPUT
              echo "Minor release triggered by PR #$PR_NUM"
            elif echo "$PR_LABELS" | grep -q "release:patch"; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_bump=patch" >> $GITHUB_OUTPUT
              echo "Patch release triggered by PR #$PR_NUM"
            else
              # Default to patch release for any PR merge to main
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version_bump=patch" >> $GITHUB_OUTPUT
              echo "Default patch release for PR #$PR_NUM (no version label found)"
            fi
          elif echo "$COMMIT_MSG" | head -n 1 | grep -q "^chore: bump version to "; then
            # The release job's own version commit: never release it again.
            echo "Automated version bump commit - no release triggered"
          else
            # Every other push to main is a patch release, unless the commit
            # message has a "Release-As: minor|major" (or patch) line.
            BUMP=$(echo "$COMMIT_MSG" | grep -oiE "^Release-As: *(patch|minor|major) *$" | head -n 1 | sed -E 's/^[^:]*: *//' | tr 'A-Z' 'a-z' | tr -d ' ' || true)
            BUMP=${BUMP:-patch}
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version_bump=$BUMP" >> $GITHUB_OUTPUT
            echo "$BUMP release for the pushed commit"
          fi
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_VERSION_BUMP: ${{ github.event.inputs.version_bump }}
        INPUT_PUBLISH_TAG: ${{ github.event.inputs.publish_existing_tag }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Every write (push, tag, release, assets) uses the VERSION_BUMP_WORKFLOW token.
    # GITHUB_TOKEN only lists releases here.
    permissions:
      contents: read
    needs: check-for-release
    if: needs.check-for-release.outputs.should_release == 'true'
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Release from the tip of main, not the event commit: a push that landed
        # while this run was queued is included, and the bump commit fast-forwards.
        ref: main
        fetch-depth: 0
        token: ${{ secrets.VERSION_BUMP_WORKFLOW }}
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "semver==3.1.1"

    - name: Calculate new version
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get the latest release from GitHub
        echo "Fetching latest release from GitHub..."
        LATEST_RELEASE=$(gh release list --limit 1 --json tagName,isLatest --jq '.[0].tagName // "v0.0.0"')
        
        # Remove 'v' prefix if present
        CURRENT_VERSION=${LATEST_RELEASE#v}
        echo "Current version from GitHub releases: $CURRENT_VERSION"
        
        # Never go backwards: if inventag/_version.py is ahead of the latest
        # release (a version committed by hand), bump from that instead.
        FILE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' inventag/_version.py)
        if [ -n "$FILE_VERSION" ] && [ "$(printf '%s\n%s\n' "$CURRENT_VERSION" "$FILE_VERSION" | sort -V | tail -n 1)" = "$FILE_VERSION" ]; then
          CURRENT_VERSION="$FILE_VERSION"
          echo "Using inventag/_version.py as the current version: $CURRENT_VERSION"
        fi

        # If no releases exist, start with 0.0.0
        if [ "$CURRENT_VERSION" = "" ] || [ "$CURRENT_VERSION" = "null" ]; then
          CURRENT_VERSION="0.0.0"
          echo "No existing releases found, starting with version 0.0.0"
        fi
        
        # Calculate new version based on bump type
        BUMP_TYPE="${{ needs.check-for-release.outputs.version_bump }}"
        echo "Bump type: $BUMP_TYPE"
        
        # Fail the job on an unparsable version instead of inventing one.
        NEW_VERSION=$(CURRENT_VERSION="$CURRENT_VERSION" BUMP_TYPE="$BUMP_TYPE" python -c "
        import os, semver
        version = semver.Version.parse(os.environ['CURRENT_VERSION'])
        bump = {'major': version.bump_major, 'minor': version.bump_minor, 'patch': version.bump_patch}
        print(bump[os.environ['BUMP_TYPE']]())
        ")
        
        echo "✅ Version calculation complete:"
        echo "  📋 Source: GitHub Releases API"
        echo "  📌 Current: $CURRENT_VERSION"  
        echo "  🚀 New: $NEW_VERSION"
        echo "  🏷️ Tag: v$NEW_VERSION"
        echo "  📈 Bump: $BUMP_TYPE"
        
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=v$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Generate comprehensive release notes for version.json
      id: version_notes
      run: |
        # Get commits since last tag for version.json release notes
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$LAST_TAG" ]; then
          echo "No previous tags found, generating notes from first commit"
          COMMIT_RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
        else
          echo "Last tag: $LAST_TAG"
          COMMIT_RANGE="$LAST_TAG..HEAD"
        fi
        
        # Generate structured release notes for version.json
        python -c "
        import json
        import subprocess
        import re
        from datetime import datetime
        
        # Get commit messages
        result = subprocess.run(['git', 'log', '$COMMIT_RANGE', '--pretty=format:%s', '--no-merges'], 
                              capture_output=True, text=True)
        commits = result.stdout.strip().split('\n') if result.stdout.strip() else []
        
        # Categorize commits
        features = []
        fixes = []
        docs = []
        chores = []
        style = []
        refactor = []
        perf = []
        test = []
        other = []
        
        for commit in commits:
            if not commit.strip():
                continue
            commit_lower = commit.lower()
            if commit_lower.startswith('feat'):
                features.append(commit)
            elif commit_lower.startswith('fix'):
                fixes.append(commit)
            elif commit_lower.startswith('docs'):
                docs.append(commit)
            elif commit_lower.startswith('chore'):
                chores.append(commit)
            elif commit_lower.startswith('style'):
                style.append(commit)
            elif commit_lower.startswith('refactor'):
                refactor.append(commit)
            elif commit_lower.startswith('perf'):
                perf.append(commit)
            elif commit_lower.startswith('test'):
                test.append(commit)
            else:
                other.append(commit)
        
        # Build comprehensive release notes
        notes_parts = []
        notes_parts.append(f'Release ${{ steps.version.outputs.new_version }} - {datetime.now().strftime(\"%Y-%m-%d\")}')
        notes_parts.append('')
        
        if features:
            notes_parts.append('✨ New Features:')
            for feat in features:
                notes_parts.append(f'  • {feat}')
            notes_parts.append('')
        
        if fixes:
            notes_parts.append('🐛 Bug Fixes:')
            for fix in fixes:
                notes_parts.append(f'  • {fix}')
            notes_parts.append('')
        
        if docs:
            notes_parts.append('📚 Documentation:')
            for doc in docs:
                notes_parts.append(f'  • {doc}')
            notes_parts.append('')
        
        if style:
            notes_parts.append('💄 Style Changes:')
            for s in style:
                notes_parts.append(f'  • {s}')
            notes_parts.append('')
        
        if refactor:
            notes_parts.append('♻️ Code Refactoring:')
            for r in refactor:
                notes_parts.append(f'  • {r}')
            notes_parts.append('')
        
        if perf:
            notes_parts.append('⚡ Performance Improvements:')
            for p in perf:
                notes_parts.append(f'  • {p}')
            notes_parts.append('')
        
        if test:
            notes_parts.append('✅ Tests:')
            for t in test:
                notes_parts.append(f'  • {t}')
            notes_parts.append('')
        
        if chores:
            notes_parts.append('🔧 Maintenance:')
            for chore in chores:
                notes_parts.append(f'  • {chore}')
            notes_parts.append('')
        
        if other:
            notes_parts.append('📝 Other Changes:')
            for o in other:
                notes_parts.append(f'  • {o}')
            notes_parts.append('')
        
        # Add summary statistics
        total_commits = len([c for c in commits if c.strip()])
        if total_commits > 0:
            notes_parts.append(f'📊 Summary: {total_commits} commits in this release')
            
            if '${{ needs.check-for-release.outputs.pr_number }}':
                notes_parts.append(f'🔀 Triggered by PR #${{ needs.check-for-release.outputs.pr_number }}')
        
        release_notes = '\n'.join(notes_parts)
        print('Generated release notes for version.json:')
        print(release_notes)
        print('---')
        
        # Save release notes to a file for the next step
        with open('version_release_notes.txt', 'w') as f:
            f.write(release_notes)
        "

    - name: Generate release notes
      id: release_notes
      env:
        NEW_VERSION: ${{ steps.version.outputs.new_version }}
        TAG_NAME: ${{ steps.version.outputs.tag_name }}
        PR_NUMBER: ${{ needs.check-for-release.outputs.pr_number }}
        REPO: ${{ github.repository }}
        PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
      run: |
        # Only facts the workflow can check: the commits, the PR, the version and links.
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          COMMIT_RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
        else
          COMMIT_RANGE="$LAST_TAG..HEAD"
        fi
        echo "Generating release notes for commits: $COMMIT_RANGE"

        {
          echo "# InvenTag $NEW_VERSION"
          echo
          echo "## Changes"
          echo
          git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges
          echo
          if [ -n "$PR_NUMBER" ]; then
            echo
            echo "Released from pull request #$PR_NUMBER."
          fi
          echo
          echo "## Install"
          echo
          if [ "$PYPI_PUBLISH" = "true" ]; then
            echo '```bash'
            echo "pip install inventag-aws==$NEW_VERSION"
            echo '```'
            echo
            echo "PyPI: https://pypi.org/project/inventag-aws/$NEW_VERSION/"
          else
            echo "Download the source archive attached to this release."
          fi
          echo
          echo "## Links"
          echo
          echo "- Documentation: https://habhabhabs.github.io/inventag-aws/docs/"
          echo "- Installation: https://habhabhabs.github.io/inventag-aws/docs/getting-started/installation"
          if [ -n "$LAST_TAG" ]; then
            echo "- Full changelog: https://github.com/$REPO/compare/$LAST_TAG...$TAG_NAME"
          fi
          echo
          echo "---"
          echo
          echo "AWS is a trademark of Amazon Web Services, Inc. InvenTag is an independent tool and is not affiliated with, endorsed by, or sponsored by Amazon Web Services, Inc."
        } > release_notes.md

        echo "Release notes: $(wc -l < release_notes.md) lines"
        cat release_notes.md

    - name: Update version.json with new version
      run: |
        # Update version.json with comprehensive information
        python -c "
        import json
        import sys
        from datetime import datetime
        
        # Load current version.json or create new one
        try:
            with open('version.json', 'r') as f:
                version_data = json.load(f)
        except FileNotFoundError:
            # Create new version.json if it doesn't exist
            version_data = {}
        
        # Update with new version information  
        version_data['previous_version'] = '${{ steps.version.outputs.current_version }}'
        version_data['version'] = '${{ steps.version.outputs.new_version }}'
        version_data['release_date'] = datetime.now().isoformat()
        version_data['version_bump_type'] = '${{ needs.check-for-release.outputs.version_bump }}'
        # Read the notes from the file: commit subjects must never become Python source.
        with open('version_release_notes.txt', encoding='utf-8') as notes:
            version_data['release_notes'] = notes.read()
        
        # Add additional metadata
        version_data['git_tag'] = '${{ steps.version.outputs.tag_name }}'
        version_data['github_release_url'] = 'https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}'
        
        if '${{ needs.check-for-release.outputs.pr_number }}':
            version_data['triggered_by_pr'] = '${{ needs.check-for-release.outputs.pr_number }}'
            version_data['pr_url'] = 'https://github.com/${{ github.repository }}/pull/${{ needs.check-for-release.outputs.pr_number }}'
        
        # Write updated version.json
        with open('version.json', 'w') as f:
            json.dump(version_data, f, indent=2, ensure_ascii=False)
        
        print('✅ Updated version.json with new version ${{ steps.version.outputs.new_version }}')
        "
        
        echo "Version.json updated with:"
        echo "  - New version: ${{ steps.version.outputs.new_version }}"
        echo "  - Previous version: ${{ steps.version.outputs.current_version }}"
        echo "  - Bump type: ${{ needs.check-for-release.outputs.version_bump }}"
        echo "  - Git tag: ${{ steps.version.outputs.tag_name }}"

    - name: Commit and push version.json changes
      env:
        GITHUB_TOKEN: ${{ secrets.VERSION_BUMP_WORKFLOW }}
      run: |
        # Configure git user for the commit
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Keep the package version (read by pyproject.toml) equal to the release
        printf '"""Single source of the InvenTag version.\n\nThe release workflow rewrites this file. pyproject.toml reads it at build time.\n"""\n\n__version__ = "%s"\n' "${{ steps.version.outputs.new_version }}" > inventag/_version.py

        # Check if the version files have actually changed
        if git diff --quiet version.json inventag/_version.py; then
          echo "No changes to version.json - skipping commit"
        else
          # Add and commit the version changes directly to main
          git add version.json inventag/_version.py
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}" -m "Automated version bump after release creation." -m "Previous version: ${{ steps.version.outputs.current_version }}" -m "New version: ${{ steps.version.outputs.new_version }}" -m "Bump type: ${{ needs.check-for-release.outputs.version_bump }}"
          
          # Push directly to main using the VERSION_BUMP_WORKFLOW token. Rebase first
          # in case a commit landed during this job; the next run then finds it released.
          git pull --rebase origin main
          git push origin main
          echo "✅ Successfully pushed version bump to main"
        fi

    - name: Create Git Tag
      env:
        GITHUB_TOKEN: ${{ secrets.VERSION_BUMP_WORKFLOW }}
      run: |
        # Create tag from main branch (after version bump commit)
        git tag ${{ steps.version.outputs.tag_name }}
        git push origin ${{ steps.version.outputs.tag_name }}
        echo "Created and pushed tag ${{ steps.version.outputs.tag_name }} from main branch"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.VERSION_BUMP_WORKFLOW }}
      run: |
        gh release create ${{ steps.version.outputs.tag_name }} \
          --title "🏷️ InvenTag Release v${{ steps.version.outputs.new_version }}" \
          --notes-file release_notes.md \
          --latest

    - name: Upload Release Assets
      env:
        GH_TOKEN: ${{ secrets.VERSION_BUMP_WORKFLOW }}
      run: |
        # Create a source archive
        git archive --format=tar.gz --prefix=inventag-aws-${{ steps.version.outputs.new_version }}/ HEAD > inventag-aws-${{ steps.version.outputs.new_version }}.tar.gz
        
        # Upload to release
        gh release upload ${{ steps.version.outputs.tag_name }} inventag-aws-${{ steps.version.outputs.new_version }}.tar.gz

    - name: Create ZIP archive for release
      env:
        GH_TOKEN: ${{ secrets.VERSION_BUMP_WORKFLOW }}
      run: |
        # Create a clean ZIP archive of the repository
        mkdir -p inventag-aws-${{ steps.version.outputs.new_version }}
        git archive HEAD | tar -x -C inventag-aws-${{ steps.version.outputs.new_version }}/
        
        # Create ZIP file
        zip -r inventag-aws-${{ steps.version.outputs.new_version }}.zip inventag-aws-${{ steps.version.outputs.new_version }}/
        
        # Upload ZIP to release
        gh release upload ${{ steps.version.outputs.tag_name }} inventag-aws-${{ steps.version.outputs.new_version }}.zip

    - name: Post-release notification
      run: |
        echo "🚀 Successfully created InvenTag release ${{ steps.version.outputs.new_version }}"
        echo "📦 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}"
        echo "📋 Release created for version ${{ steps.version.outputs.new_version }} (${{ needs.check-for-release.outputs.version_bump }} release)"
        echo "✅ Version.json updated and committed to main branch"
        echo "🏷️ Git tag ${{ steps.version.outputs.tag_name }} created and pushed"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [check-for-release, release]
    # Publishes in three cases:
    #   1. a release was just created (the release job commits the bumped version),
    #   2. the push of that "chore: bump version to" commit, as a retry when case 1
    #      did not upload (see "Already on PyPI?"); other pushes never publish,
    #      so a [skip release] push does not touch the pypi environment,
    #   3. a manual run with "publish_existing_tag".
    # A version that is already on PyPI is skipped, never re-uploaded (PyPI refuses it),
    # and skip-existing turns a race between cases 1 and 2 into a no-op.
    if: >-
      always() && vars.PYPI_PUBLISH == 'true' && (
        (needs.check-for-release.outputs.should_release == 'true' && needs.release.result == 'success') ||
        (github.event_name == 'push' && needs.check-for-release.outputs.should_release != 'true' &&
         startsWith(github.event.head_commit.message, 'chore: bump version to ')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_existing_tag != '')
      )
    # PyPI Trusted Publishing (OIDC): no API token is stored in GitHub.
    # One-time setup on pypi.org: add a trusted publisher for this repository,
    # workflow "release.yml", environment "pypi". Then set the repository
    # variable PYPI_PUBLISH to "true".
    environment:
      name: pypi
      url: https://pypi.org/project/inventag-aws/
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout the commit to publish
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.publish_existing_tag || (needs.release.outputs.new_version != '' && format('v{0}', needs.release.outputs.new_version)) || github.sha }}

    - name: Work out the version
      id: version
      run: |
        VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' inventag/_version.py)
        case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version: $VERSION"; exit 1;; esac
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version in this commit: $VERSION"

    # Never publish a version without its tag and GitHub release. This matters for
    # case 2: if the release run pushed the bump commit but failed to tag it or to
    # create the release, the bump commit's run must not upload that version.
    - name: Tag and release exist?
      id: tagged
      env:
        VERSION: ${{ steps.version.outputs.version }}
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        # Peeled (^{}) entry for an annotated tag, plain entry for a lightweight one
        TAG_SHA=$(git ls-remote --tags origin | awk -v t="refs/tags/v$VERSION" '$2 == t "^{}" {p = $1} $2 == t {l = $1} END {print (p != "" ? p : l)}')
        if [ "$TAG_SHA" = "$HEAD_SHA" ] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null; then
          echo "Tag v$VERSION and its release exist for $HEAD_SHA"
          echo "ok=true" >> "$GITHUB_OUTPUT"
        elif [ "$EVENT_NAME" = "push" ]; then
          echo "::notice::v$VERSION has no tag on $HEAD_SHA (tag: ${TAG_SHA:-none}) or no GitHub release: nothing published. Finish the release, then run Automated Release with publish_existing_tag."
          echo "ok=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::v$VERSION has no tag on $HEAD_SHA (tag: ${TAG_SHA:-none}) or no GitHub release: refusing to publish."
          exit 1
        fi

    - name: Already on PyPI?
      id: exists
      if: steps.tagged.outputs.ok == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/inventag-aws/$VERSION/json" || true)
        if [ "$CODE" = "200" ]; then
          echo "inventag-aws $VERSION is already on PyPI: nothing to publish"
          echo "published=true" >> "$GITHUB_OUTPUT"
        else
          echo "inventag-aws $VERSION is not on PyPI yet (HTTP $CODE)"
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      if: steps.exists.outputs.published == 'false'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Build the sdist and the wheel
      if: steps.exists.outputs.published == 'false'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
        # The built version must be the version in the commit
        ls dist/inventag_aws-"$VERSION"-py3-none-any.whl

    - name: Publish to PyPI
      if: steps.exists.outputs.published == 'false'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        skip-existing: true
