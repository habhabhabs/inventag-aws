name: GitHub Actions checks

# Checks the GitHub Actions code itself (.github/**): workflows and their
# scripts. It is separate from the application pipeline (ci.yml) and never
# makes a release.
"on":
  push:
    branches: [ main ]
    paths:
      - '.github/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check workflow code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install test tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # pytest pinned as in requirements-dev.txt; PyYAML as in requirements.txt
        pip install "pytest==9.2.0" "PyYAML>=6.0"

    - name: Every workflow file parses
      shell: bash
      run: |
        python - <<'EOF'
        import pathlib
        import sys

        import yaml

        files = sorted(pathlib.Path(".github/workflows").glob("*.y*ml"))
        bad = 0
        for path in files:
            try:
                data = yaml.safe_load(path.read_text(encoding="utf-8"))
                if not isinstance(data, dict) or "jobs" not in data:
                    raise ValueError("no top-level 'jobs' mapping")
                print(f"ok: {path}")
            except Exception as error:  # report every file, then fail
                bad += 1
                print(f"::error file={path}::{error}")
        print(f"{len(files)} workflow file(s), {bad} problem(s)")
        sys.exit(1 if bad or not files else 0)
        EOF

    - name: Install actionlint (pinned version and checksum)
      shell: bash
      env:
        ACTIONLINT_VERSION: '1.7.12'
        # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, as published in
        # actionlint_1.7.12_checksums.txt on the v1.7.12 release
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL -o actionlint.tar.gz \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
        tar -xzf actionlint.tar.gz actionlint
        ./actionlint -version

    # The shell inside `run:` blocks is not passed to shellcheck yet
    # (-shellcheck=): the existing workflows have findings to fix first.
    # Scripts in .github/scripts are shellchecked in full below.
    - name: actionlint
      shell: bash
      run: |
        "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

    - name: shellcheck and bash -n on .github/scripts
      shell: bash
      run: |
        shellcheck --version
        for script in .github/scripts/*.sh; do
          bash -n "$script"
          echo "bash -n ok: $script"
        done
        shellcheck .github/scripts/*.sh

    - name: Tests of the workflow code
      shell: bash
      run: |
        python -m pytest -q \
          tests/unit/test_release_needed.py \
          "tests/backward_compatibility/test_github_actions_compatibility.py::TestGitHubActionsCompatibility"
