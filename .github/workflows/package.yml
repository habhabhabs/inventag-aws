name: Package

# Builds the packaged forms of one release tag: the executable for three
# systems (a directory, as .tar.gz), a .deb and an .rpm for both Linux CPUs,
# smoke tests on fresh systems, checksums, SBOMs and build attestations
# (plan v14 section 3.5). Called by release.yml as its last job, after the PyPI
# publish: this workflow can fail, and the PyPI release is already done. A
# failed run is started again by hand (Actions, Package, Run workflow).
#
# A release published with the workflow's own token starts no other workflow,
# so there is no `release: published` trigger here.
#
# dry_run (the default for a manual run) builds and tests everything and
# attaches nothing to the release: no upload, no attestation.
#
# A pull request that changes packaging also runs this workflow, always as a
# dry run of the pull request's own commit (the paths below limit it). A pull
# request runs the workflow file of its own branch, so the first dry run needs
# no file on main. On a pull request from a fork the token is read-only, no
# secret exists, and nothing is attached. After v1.4.0 the same trigger is the
# regression check for packaging changes.
#
# The `package` job of release.yml must not reach main before v1.4.0: a patch
# release made from main (v1.3.2) would start packaging a tag that has no
# packaging/ directory. tests/unit/test_packaging_workflow.py fails on any tree
# that calls this workflow and lacks the files it packages.
#
# No secret of the repository is used. Nothing is published outside this
# repository.
"on":
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to package (for example v1.4.0). The tag must exist.'
        required: false
        default: ''
        type: string
      ref:
        description: 'Dry run only: a branch or commit to build instead of a tag (for example next/v1.4).'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and test only: attach nothing to the release.'
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
    - 'packaging/**'
    - 'scripts/packaging/**'
    - 'requirements-lock*.txt'
    - '.github/workflows/package.yml'
    - 'inventag/cli/selftest.py'
    - 'inventag/cli/completion.py'
    # An application change can break the bundle (a missed import or data
    # file): the dry run sees it before a release does (B6 fix 4). Cost: one
    # Package dry run per pull request that changes the application.
    - 'inventag/**'
    - 'pyproject.toml'
    - 'requirements.txt'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (for example v1.4.0). The tag must exist.'
        required: false
        default: ''
        type: string
      ref:
        description: 'Dry run only: a branch or commit to build instead of a tag (for example next/v1.4).'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and test only: attach nothing to the release.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  # The build image: the official almalinux:9 image (AlmaLinux 9, OpenSSL 3,
  # the distribution's own Python 3.12 with a shared libpython), pinned by the
  # digest of its multi-architecture index. The Linux files need glibc 2.34 or
  # later (the glibc of this image; architect ruling, package-dryrun-1): older
  # systems use pipx. AlmaLinux 9 gets security fixes until RHEL 9's end of
  # maintenance (2032; not verified here). A new digest is a reviewed change:
  # the executable carries this image's OpenSSL, zlib, expat, bzip2 and xz. The
  # value below is written by hand after a dry run: the jobs fail, name the
  # digest of almalinux:9 at that moment, and the same value must be printed by
  # both CPUs before it is written in. Nothing here is a guess.
  ALMALINUX_9_DIGEST: 02df05719ef287ebd0df0a1eedb9172a00bd70703aed7b25660e426b8e0d6047
  # nfpm builds the .deb and .rpm. The sha256 of each Linux tarball is in the
  # job that uses it (from checksums.txt of the v2.49.0 release).
  NFPM_VERSION: '2.49.0'
  # Switch for the macOS builds, their smoke tests and the macOS files of the
  # release. 'true' is the target of v1.4.0. Fallback decided by the architect
  # (not the default): if macOS is not green after three dry-run rounds, v1.4.0
  # ships the Linux files only; set this to 'false', and the macOS builds and
  # the tap move to v1.4.1. A job condition cannot read `env`: the plan job
  # passes the value on as an output.
  INCLUDE_MACOS: 'true'

# One run per tag (or per pull request: both inputs are empty there). A running
# package job is never cancelled: a half-uploaded release is worse than a late
# one.
concurrency:
  group: package-${{ inputs.tag || inputs.ref || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      include_macos: ${{ steps.plan.outputs.include_macos }}
    steps:
    # A pull request builds its own commit, not the merge commit.
    - name: Checkout the tag (or, in a dry run, the ref or the pull request's commit)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref || format('refs/tags/{0}', inputs.tag) }}
        persist-credentials: false

    - name: Work out the version and check the tag against it
      id: plan
      env:
        EVENT_NAME: ${{ github.event_name }}
        TAG: ${{ inputs.tag }}
        REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}
        DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
        INCLUDE_MACOS: ${{ env.INCLUDE_MACOS }}
      run: |
        case "$INCLUDE_MACOS" in true|false) ;; *) echo "::error::INCLUDE_MACOS in package.yml must be 'true' or 'false'."; exit 1;; esac
        case "$DRY_RUN" in true|false) ;; *) echo "::error::dry_run must be true or false."; exit 1;; esac
        if [ "$EVENT_NAME" = pull_request ] && { [ -n "$TAG" ] || [ -z "$REF" ] || [ "$DRY_RUN" != true ]; }; then
          echo "::error::A pull request is a dry run of its own commit: no tag, a commit, dry_run true."
          exit 1
        fi
        VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' inventag/_version.py)
        if [ -n "$REF" ]; then
          # A branch or commit is built for a dry run only: a release carries
          # the files of a tag.
          if [ "$DRY_RUN" != true ]; then
            echo "::error::A ref is for a dry run only. Package a release with its tag and no ref."
            exit 1
          fi
          # The ref is written to the step output below: a newline in it would
          # add an output line. =~ matches the whole value (grep, line by line,
          # would not).
          ref_pattern='^[A-Za-z0-9._/-]+$'
          if ! [[ "$REF" =~ $ref_pattern ]]; then
            echo "::error::The ref may hold letters, digits and . _ / - only."
            exit 1
          fi
          OUT_REF="$REF"
        else
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag must look like v1.4.0."
            exit 1
          fi
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::Tag $TAG holds version '$VERSION' in inventag/_version.py. Package the tag of a release, not another commit."
            exit 1
          fi
          OUT_REF="refs/tags/$TAG"
        fi
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::inventag/_version.py holds '$VERSION', not a version."
          exit 1
        fi
        for lock in requirements-lock.txt requirements-lock-build.txt; do
          test -f "$lock" || { echo "::error::$lock is missing at $OUT_REF."; exit 1; }
        done
        {
          echo "tag=$TAG"
          echo "ref=$OUT_REF"
          echo "version=$VERSION"
          echo "dry_run=$DRY_RUN"
          echo "include_macos=$INCLUDE_MACOS"
        } >> "$GITHUB_OUTPUT"
        echo "Packaging $OUT_REF (version $VERSION), dry run: $DRY_RUN, macOS: $INCLUDE_MACOS"

  # The Linux executable is built inside AlmaLinux 9. The container is driven
  # with docker from the runner (not as a job container: the checkout action
  # needs a newer libc than the image has).
  # build-linux-arm64 below runs the same commands on the arm64 runner.
  build-linux-x86_64:
    name: Build (Linux x86_64)
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CPU: x86_64
      NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
    - name: Checkout the tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan.outputs.ref }}
        persist-credentials: false

    - name: Pull the build image by digest
      run: |
        if ! printf '%s' "$ALMALINUX_9_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
          docker pull almalinux:9 > /dev/null
          NOW=$(docker image inspect --format '{{index .RepoDigests 0}}' almalinux:9)
          echo "::error::ALMALINUX_9_DIGEST in package.yml is not a sha256 digest. almalinux:9 is $NOW now. Write the 64 hex digits after sha256: into package.yml, review them, and run again."
          exit 1
        fi
        docker pull "almalinux@sha256:${ALMALINUX_9_DIGEST}"

    - name: Start the build container
      run: |
        mkdir -p "$RUNNER_TEMP/work"
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        docker run -d --name build \
          -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/work:/work" \
          -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" -e LANG=C.UTF-8 \
          "almalinux@sha256:${ALMALINUX_9_DIGEST}" sleep infinity

    - name: Build-image check (AlmaLinux 9, system Python 3.12 with a shared libpython)
      run: |
        docker exec -i -e ALMALINUX_9_DIGEST build bash -s <<'CHECK'
        set -euo pipefail
        . /etc/os-release
        test "$ID" = almalinux
        case "$VERSION_ID" in 9|9.*) ;; *) echo "not AlmaLinux 9: $VERSION_ID"; exit 1;; esac
        dnf install -y python3.12 python3.12-pip binutils tar gzip
        python3.12 -c 'import sys, sysconfig; assert sys.version_info[:2] == (3, 12), sys.version; assert sysconfig.get_config_var("Py_ENABLE_SHARED") == 1, "no shared libpython"'
        ldd "$(python3.12 -c 'import sys; print(sys.executable)')" | grep libpython3.12
        test "$(rpm -q --qf '%{VERSION}' glibc)" = 2.34
        {
          echo "image: almalinux@sha256:${ALMALINUX_9_DIGEST:-unknown}"
          echo "PRETTY_NAME: $PRETTY_NAME"
          rpm -q almalinux-release glibc openssl-libs zlib expat bzip2-libs xz-libs python3.12 python3.12-libs python3.12-pip
        } | tee /work/build-image.txt
        CHECK

    - name: Install the build environment from the hash-pinned locks
      run: docker exec build bash /src/scripts/packaging/build_binary.sh venv /work/venv python3.12

    - name: Build the executable, check the licences, run selftest, write the archive
      run: docker exec build bash /src/scripts/packaging/build_binary.sh build /work/venv /work/out

    - name: Hand the files back to the runner user
      run: docker exec build chown -R "$(id -u):$(id -g)" /work

    - name: Install nfpm (version and sha256 pinned)
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${CPU}.tar.gz"
        echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/bin"
        tar -xzf nfpm.tar.gz -C "$RUNNER_TEMP/bin" nfpm
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Build the .deb and the .rpm
      run: bash scripts/packaging/build_linux_packages.sh "$RUNNER_TEMP/work/out"

    - name: Collect the files of this build
      run: |
        out="$RUNNER_TEMP/work/out"
        up="$RUNNER_TEMP/upload"
        mkdir -p "$up"
        base="inventag-${VERSION}-linux-${CPU}"
        cp "$out/$base.tar.gz" "$up/"
        cp "$out/dist/inventag/THIRD-PARTY-LICENSES.txt" "$up/$base.THIRD-PARTY-LICENSES.txt"
        cp "$out/components.json" "$up/$base.components.json"
        cp "$RUNNER_TEMP/work/build-image.txt" "$up/$base.build-image.txt"
        cp "$out"/pkg/*.deb "$out"/pkg/*.rpm "$up/"
        ls -l "$up"

    - name: Upload the files of this build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-linux-x86_64
        path: ${{ runner.temp }}/upload/*
        if-no-files-found: error
        retention-days: 7

  build-linux-arm64:
    name: Build (Linux arm64)
    needs: plan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CPU: arm64
      NFPM_SHA256: d4eee71839e92c68cbd3b101640bad32d2856fc551acae0635be9118e48c9d9c
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
    - name: Checkout the tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan.outputs.ref }}
        persist-credentials: false

    - name: Pull the build image by digest
      run: |
        if ! printf '%s' "$ALMALINUX_9_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
          docker pull almalinux:9 > /dev/null
          NOW=$(docker image inspect --format '{{index .RepoDigests 0}}' almalinux:9)
          echo "::error::ALMALINUX_9_DIGEST in package.yml is not a sha256 digest. almalinux:9 is $NOW now. Write the 64 hex digits after sha256: into package.yml, review them, and run again."
          exit 1
        fi
        docker pull "almalinux@sha256:${ALMALINUX_9_DIGEST}"

    - name: Start the build container
      run: |
        mkdir -p "$RUNNER_TEMP/work"
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        docker run -d --name build \
          -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/work:/work" \
          -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" -e LANG=C.UTF-8 \
          "almalinux@sha256:${ALMALINUX_9_DIGEST}" sleep infinity

    - name: Build-image check (AlmaLinux 9, system Python 3.12 with a shared libpython)
      run: |
        docker exec -i -e ALMALINUX_9_DIGEST build bash -s <<'CHECK'
        set -euo pipefail
        . /etc/os-release
        test "$ID" = almalinux
        case "$VERSION_ID" in 9|9.*) ;; *) echo "not AlmaLinux 9: $VERSION_ID"; exit 1;; esac
        dnf install -y python3.12 python3.12-pip binutils tar gzip
        python3.12 -c 'import sys, sysconfig; assert sys.version_info[:2] == (3, 12), sys.version; assert sysconfig.get_config_var("Py_ENABLE_SHARED") == 1, "no shared libpython"'
        ldd "$(python3.12 -c 'import sys; print(sys.executable)')" | grep libpython3.12
        test "$(rpm -q --qf '%{VERSION}' glibc)" = 2.34
        {
          echo "image: almalinux@sha256:${ALMALINUX_9_DIGEST:-unknown}"
          echo "PRETTY_NAME: $PRETTY_NAME"
          rpm -q almalinux-release glibc openssl-libs zlib expat bzip2-libs xz-libs python3.12 python3.12-libs python3.12-pip
        } | tee /work/build-image.txt
        CHECK

    - name: Install the build environment from the hash-pinned locks
      run: docker exec build bash /src/scripts/packaging/build_binary.sh venv /work/venv python3.12

    - name: Build the executable, check the licences, run selftest, write the archive
      run: docker exec build bash /src/scripts/packaging/build_binary.sh build /work/venv /work/out

    - name: Hand the files back to the runner user
      run: docker exec build chown -R "$(id -u):$(id -g)" /work

    - name: Install nfpm (version and sha256 pinned)
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${CPU}.tar.gz"
        echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/bin"
        tar -xzf nfpm.tar.gz -C "$RUNNER_TEMP/bin" nfpm
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Build the .deb and the .rpm
      run: bash scripts/packaging/build_linux_packages.sh "$RUNNER_TEMP/work/out"

    # The arm64 packages are installed once here, on the arm64 runner, in a
    # fresh container each (.deb on debian:12). The x86_64 packages are smoked by
    # smoke-linux. The image is pulled by tag with docker pull; the digest of that pull goes into the summary.
    - name: "Start smoke container: .deb on debian:12"
      env:
        IMAGE: debian:12
      run: |
        pulled=$(docker pull "$IMAGE")
        printf '%s\n' "$pulled"
        digest=$(printf '%s\n' "$pulled" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n 1)
        if [ -z "$digest" ]; then
          echo "::error::No digest is recorded for the image $IMAGE."
          exit 1
        fi
        echo "- smoke image $IMAGE: $digest (arm64)" >> "$GITHUB_STEP_SUMMARY"
        docker run -d --name smoke-deb -v "$RUNNER_TEMP/work/out/pkg:/pkg:ro" "$IMAGE" sleep infinity

    - name: "Install smoke: .deb on debian:12"
      run: |
        docker exec -i -e VERSION smoke-deb bash -s <<'SMOKE'
        set -euo pipefail
        test "$(uname -m)" = aarch64
        dpkg -i /pkg/inventag_*_arm64.deb
        test "$(inventag --version)" = "inventag $VERSION"
        inventag selftest
        dpkg -r inventag
        # bash remembers the path of a command that ran before; forget it, or
        # command -v names a file that the uninstall removed (dry run 6)
        hash -r
        if command -v inventag; then
          echo "left: inventag is still on the PATH"
          exit 1
        fi
        SMOKE

    - name: "Remove smoke container: .deb on debian:12"
      if: always()
      run: docker rm -f smoke-deb

    # The arm64 packages are installed once here, on the arm64 runner, in a
    # fresh container each (.rpm on rockylinux:9). The x86_64 packages are smoked by
    # smoke-linux. The image is pulled by tag with docker pull; the digest of that pull goes into the summary.
    - name: "Start smoke container: .rpm on rockylinux:9"
      env:
        IMAGE: rockylinux:9
      run: |
        pulled=$(docker pull "$IMAGE")
        printf '%s\n' "$pulled"
        digest=$(printf '%s\n' "$pulled" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n 1)
        if [ -z "$digest" ]; then
          echo "::error::No digest is recorded for the image $IMAGE."
          exit 1
        fi
        echo "- smoke image $IMAGE: $digest (arm64)" >> "$GITHUB_STEP_SUMMARY"
        docker run -d --name smoke-rpm -v "$RUNNER_TEMP/work/out/pkg:/pkg:ro" "$IMAGE" sleep infinity

    - name: "Install smoke: .rpm on rockylinux:9"
      run: |
        docker exec -i -e VERSION smoke-rpm bash -s <<'SMOKE'
        set -euo pipefail
        test "$(uname -m)" = aarch64
        dnf install -y -q /pkg/inventag-*.aarch64.rpm
        test "$(inventag --version)" = "inventag $VERSION"
        inventag selftest
        dnf remove -y -q inventag
        # bash remembers the path of a command that ran before; forget it, or
        # command -v names a file that the uninstall removed (dry run 6)
        hash -r
        if command -v inventag; then
          echo "left: inventag is still on the PATH"
          exit 1
        fi
        SMOKE

    - name: "Remove smoke container: .rpm on rockylinux:9"
      if: always()
      run: docker rm -f smoke-rpm

    - name: Collect the files of this build
      run: |
        out="$RUNNER_TEMP/work/out"
        up="$RUNNER_TEMP/upload"
        mkdir -p "$up"
        base="inventag-${VERSION}-linux-${CPU}"
        cp "$out/$base.tar.gz" "$up/"
        cp "$out/dist/inventag/THIRD-PARTY-LICENSES.txt" "$up/$base.THIRD-PARTY-LICENSES.txt"
        cp "$out/components.json" "$up/$base.components.json"
        cp "$RUNNER_TEMP/work/build-image.txt" "$up/$base.build-image.txt"
        cp "$out"/pkg/*.deb "$out"/pkg/*.rpm "$up/"
        ls -l "$up"

    - name: Upload the files of this build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-linux-arm64
        path: ${{ runner.temp }}/upload/*
        if-no-files-found: error
        retention-days: 7

  build-macos-arm64:
    name: Build (macOS arm64)
    needs: plan
    if: needs.plan.outputs.include_macos == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      CPU: arm64
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
    - name: Checkout the tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan.outputs.ref }}
        persist-credentials: false

    # The patch version is PINNED_PYTHON["darwin"] of
    # scripts/packaging/third_party_licenses.py (a test compares the two).
    - name: Set up Python 3.12.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12.10'

    # build_binary.sh writes the archive with GNU tar options (--sort, --owner).
    - name: Put GNU tar first on the PATH
      run: |
        brew install gnu-tar
        echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Install the build environment from the hash-pinned locks
      run: bash scripts/packaging/build_binary.sh venv "$RUNNER_TEMP/venv" python

    - name: Build the executable, check the licences, run selftest, write the archive
      run: |
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        export SOURCE_DATE_EPOCH
        bash scripts/packaging/build_binary.sh build "$RUNNER_TEMP/venv" "$RUNNER_TEMP/work"

    # Evidence for the licence rows of the macOS bundle (b2f report, "Evidence
    # run 6 must print"). It changes nothing; it prints what a person reads.
    - name: macOS evidence for the licence rows
      shell: bash
      run: |
        set -u
        work="$RUNNER_TEMP/work"; bundle="$work/dist/inventag"; venv="$RUNNER_TEMP/venv"
        fw=/Library/Frameworks/Python.framework/Versions/3.12
        cat "$work/build-record-macos.txt"
        site="$("$venv/bin/python" -c 'import lxml,os;print(os.path.dirname(lxml.__file__))')"
        for f in $(cd "$site" && find . -name '*.so' | sort); do
          echo "== lxml/${f#./}"
          for p in "$site/$f" "$bundle/_internal/lxml/${f#./}"; do
            if [ ! -e "$p" ]; then echo "missing: $p"; continue; fi
            lipo -archs "$p"; otool -L "$p"; shasum -a 256 "$p"
            codesign -v "$p" && echo "codesign -v: ok" || echo "codesign -v: failed"
            codesign -dv "$p" 2>&1 | sed -n 1,5p
          done
        done
        find "$fw" -maxdepth 6 \( -iname '*licen*' -o -iname 'copying*' \) -print
        grep -n -i -E 'mpdecimal|libmpdec|Stefan Krah' "$fw/lib/python3.12/LICENSE.txt" || echo "no libmpdec notice in LICENSE.txt"
        find "$fw" -maxdepth 6 -iname 'license.html' -exec grep -n -i -E 'mpdecimal|libmpdec' {} + || echo "no license.html names libmpdec"
        "$venv/bin/python" -c "import decimal;print(decimal.__libmpdec_version__)"
        strings -a "$bundle"/_internal/python3.12/lib-dynload/_lzma*.so | grep -E '^5\.[0-9]+\.[0-9]+$' || echo "no xz version string"
        # libiconv in the lxml modules (architect-run10-macos-iconv.md section 3),
        # read from the wheel's files (the bundle's are byte-identical by the
        # licence check). Appended to the build record, which is attached to the
        # run; the licence check already wrote its own read of each slice there.
        record="$work/build-record-macos.txt"
        {
          echo "== libiconv evidence (architect-run10-macos-iconv.md section 3)"
          for f in $(cd "$site" && find . -name '*.so' | sort); do
            p="$site/${f#./}"
            if ! grep -q libiconv_open "$p"; then continue; fi
            echo "== libiconv: lxml/${f#./}"
            archs="$(lipo -archs "$p")" || archs=""
            echo "lipo -archs: ${archs:-failed}"
            for a in $archs; do
              echo "nm -arch $a:"
              nm -arch "$a" "$p" | grep -i 'iconv_version' || echo "no symbol ($a)"
              n="$(strings -arch "$a" "$p" | grep -c libiconv_open)" || n="${n:-failed}"
              echo "strings -arch $a | grep -c libiconv_open: $n"
            done
            for a in arm64 x86_64; do
              if codesign -v --architecture "$a" "$p"; then s=0; else s=$?; fi
              echo "codesign -v --architecture $a: exit $s"
            done
            echo "codesign -dv --architecture arm64 (first five lines):"
            codesign -dv --architecture arm64 "$p" 2>&1 | sed -n 1,5p || echo "codesign -dv: exit not 0"
          done
          echo "lxml in the build's Python (LXML_VERSION ICONV_COMPILED_VERSION LIBXML_VERSION LIBXML_COMPILED_VERSION LIBXSLT_VERSION):"
          "$venv/bin/python" -c "from lxml import etree; print(etree.LXML_VERSION, etree.ICONV_COMPILED_VERSION, etree.LIBXML_VERSION, etree.LIBXML_COMPILED_VERSION, etree.LIBXSLT_VERSION)" || echo "lxml report failed"
          echo "libiconv lines of the notices file:"
          grep -n -A12 "^- GNU libiconv" "$bundle/THIRD-PARTY-LICENSES.txt" || echo "no libiconv component in the notices file"
        } 2>&1 | tee -a "$record"

    - name: Collect the files of this build
      run: |
        out="$RUNNER_TEMP/work"
        up="$RUNNER_TEMP/upload"
        mkdir -p "$up"
        base="inventag-${VERSION}-darwin-${CPU}"
        cp "$out/$base.tar.gz" "$up/"
        cp "$out/dist/inventag/THIRD-PARTY-LICENSES.txt" "$up/$base.THIRD-PARTY-LICENSES.txt"
        cp "$out/components.json" "$up/$base.components.json"
        ls -l "$up"

    - name: Upload the files of this build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-macos-arm64
        path: ${{ runner.temp }}/upload/*
        if-no-files-found: error
        retention-days: 7

    # Evidence, not a release file: the name does not start with "build-", so
    # provenance and the release do not collect it.
    - name: Attach the macOS build record and notices
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: macos-build-record-arm64
        path: |
          ${{ runner.temp }}/work/build-record-macos.txt
          ${{ runner.temp }}/work/dist/inventag/THIRD-PARTY-LICENSES.txt
        if-no-files-found: error
        retention-days: 7

  # Fresh systems: install each format the way a user does, run the commands,
  # scan a simulated AWS (a moto server started here, outside the executable),
  # remove the package and check that nothing is left. The container shares the
  # runner's network so that it reaches the moto server on 127.0.0.1.
  smoke-linux:
    name: Smoke (${{ matrix.system }})
    needs: [plan, build-linux-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - { system: ubuntu-22.04, image: 'ubuntu:22.04', format: deb, shells: 'bash zsh fish' }
        - { system: ubuntu-24.04, image: 'ubuntu:24.04', format: deb, shells: 'bash zsh fish' }
        - { system: debian-12, image: 'debian:12', format: deb, shells: 'bash zsh fish' }
        - { system: debian-12-tar, image: 'debian:12', format: tar, shells: 'bash zsh fish' }
        # Fedora is floating on purpose: "current Fedora" is what the plan tests.
        - { system: fedora, image: 'fedora:latest', format: rpm, shells: 'bash zsh fish' }
        - { system: rockylinux-9, image: 'rockylinux:9', format: rpm, shells: 'bash zsh' }
        - { system: rockylinux-9-tar, image: 'rockylinux:9', format: tar, shells: 'bash zsh' }
        # The build image's own release: the glibc floor system.
        - { system: almalinux-9, image: 'almalinux:9', format: rpm, shells: 'bash zsh' }
        - { system: amazonlinux-2023, image: 'amazonlinux:2023', format: rpm, shells: 'bash zsh' }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      FORMAT: ${{ matrix.format }}
      SHELLS: ${{ matrix.shells }}
      IMAGE: ${{ matrix.image }}
    steps:
    - name: Checkout the tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan.outputs.ref }}
        persist-credentials: false

    - name: Download the build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-linux-x86_64
        path: ${{ runner.temp }}/artifacts

    - name: Set up Python 3.12 for the moto server
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install moto (the version of requirements-dev.txt)
      run: python -m pip install "moto[server]==5.2.5"

    # The images are pulled by tag on purpose, by an explicit docker pull. The
    # digest comes from the "Digest:" line of that pull (RepoDigests is empty on
    # the runner, dry run 6) and goes into the job summary, so that a failure
    # can be tied to an image.
    - name: Record the digest of the image
      run: |
        pulled=$(docker pull "$IMAGE")
        printf '%s\n' "$pulled"
        digest=$(printf '%s\n' "$pulled" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n 1)
        if [ -z "$digest" ]; then
          echo "::error::No digest is recorded for the image $IMAGE."
          exit 1
        fi
        echo "- smoke image $IMAGE: $digest" >> "$GITHUB_STEP_SUMMARY"

    - name: Start a fresh system
      run: |
        mkdir -p "$RUNNER_TEMP/smoke-shared"
        docker run -d --name smoke --network host \
          -v "$RUNNER_TEMP/artifacts:/artifacts:ro" \
          -v "$RUNNER_TEMP/smoke-shared:$RUNNER_TEMP/smoke-shared" \
          "$IMAGE" sleep infinity

    - name: Install the package
      run: |
        docker exec -i -e VERSION -e FORMAT -e SHELLS smoke bash -s <<'INSTALL'
        set -euo pipefail
        cd /artifacts
        if command -v apt-get > /dev/null; then
          # Ubuntu images exclude man pages from every package.
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq man-db $SHELLS > /dev/null
        else
          dnf install -y -q --setopt=tsflags= man-db $(printf '%s\n' $SHELLS | grep -v '^bash$')
        fi
        case "$FORMAT" in
          deb)
            dpkg -i inventag_*_amd64.deb
            dpkg -L inventag | sort > /tmp/inventag-files.txt ;;
          rpm)
            dnf install -y -q --setopt=tsflags= ./inventag-*.x86_64.rpm
            rpm -ql inventag | sort > /tmp/inventag-files.txt ;;
          tar)
            tar -xzf "inventag-${VERSION}-linux-x86_64.tar.gz" -C /opt
            ln -s /opt/inventag/inventag /usr/local/bin/inventag
            { echo /usr/local/bin/inventag; tar -tzf "inventag-${VERSION}-linux-x86_64.tar.gz" | sed 's|^|/opt/|'; } | sort > /tmp/inventag-files.txt ;;
        esac
        wc -l /tmp/inventag-files.txt
        INSTALL

    - name: Version, selftest and the man page
      run: |
        docker exec -i -e VERSION -e FORMAT smoke bash -s <<'RUN'
        set -euo pipefail
        test "$(inventag --version)" = "inventag $VERSION"
        inventag selftest
        # The package must put a valid man page in the right place. That is
        # read from the files themselves, not from the man tools of the image
        # (dry runs 8 and 9: no col on fedora and amazonlinux; the minimized
        # Ubuntu man prints the unminimize text).
        if [ "$FORMAT" = tar ]; then
          page=/opt/inventag/share/man/man1/inventag.1
        else
          page=/usr/share/man/man1/inventag.1.gz
        fi
        if [ "$FORMAT" = deb ]; then
          # The .deb is the proof; the installed file is checked below if dpkg put it there.
          deb=$(ls /artifacts/inventag_*_amd64.deb)
          roff=$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - --wildcards '*usr/share/man/man1/inventag.1.gz' | gzip -dc)
          if [ -e "$page" ]; then
            test "$(gzip -dc "$page")" = "$roff"
          elif grep -qs '^path-exclude=/usr/share/man' /etc/dpkg/dpkg.cfg /etc/dpkg/dpkg.cfg.d/*; then
            echo "note: this image's dpkg excludes /usr/share/man; the page was read from the .deb"
          else
            echo "the page is not installed at $page"
            exit 1
          fi
        else
          test -s "$page"
          case "$page" in
            *.gz) roff=$(gzip -dc "$page") ;;
            *) roff=$(cat "$page") ;;
          esac
        fi
        first=$(sed -n 1p <<<"$roff")
        [[ "$first" == ".TH INVENTAG 1 "* ]]
        name=$(sed -n '/^\.SH NAME$/{n;p;}' <<<"$roff")
        grep -q '^inventag ' <<<"$name"
        # Rendering is extra: only where man and col both work, and only when
        # man printed a page (the minimized Ubuntu man exits 0 with a notice).
        if command -v man > /dev/null && command -v col > /dev/null && [ -e "$page" ] && rendered=$(man "$page" 2> /dev/null) && ! grep -q unminimize <<<"$rendered"; then
          grep -q 'INVENTAG(1)' <<<"$rendered"
        else
          echo "note: man or col is missing or does not render here; the roff file was checked"
        fi
        RUN

    - name: Completions load in the shells of this system
      run: |
        docker exec -i -e FORMAT -e SHELLS smoke bash -s <<'COMPLETIONS'
        set -euo pipefail
        case "$FORMAT" in
          deb) B=/usr/share/bash-completion/completions/inventag; Z=/usr/share/zsh/vendor-completions/_inventag; F=/usr/share/fish/vendor_completions.d/inventag.fish ;;
          rpm) B=/usr/share/bash-completion/completions/inventag; Z=/usr/share/zsh/site-functions/_inventag; F=/usr/share/fish/vendor_completions.d/inventag.fish ;;
          tar) B=/opt/inventag/share/completions/inventag.bash; Z=/opt/inventag/share/completions/_inventag; F=/opt/inventag/share/completions/inventag.fish ;;
        esac
        for shell in $SHELLS; do
          case "$shell" in
            bash)
              bash -n "$B"
              bash -c 'source "$1" && complete -p inventag' _ "$B" ;;
            zsh)
              zsh -n "$Z"
              zsh -c 'fpath=("$(dirname "$1")" $fpath); autoload -Uz compinit && compinit -u -d /tmp/zcompdump && autoload -Uz _inventag && whence -w _inventag' _ "$Z" ;;
            fish)
              fish -n "$F"
              # grep -q leaves at the first match and fish would get SIGPIPE,
              # which pipefail turns into a silent exit 1 (dry run 6): capture first.
              out=$(fish -c 'source $argv[1]; complete -c inventag' "$F")
              grep -q inventag <<<"$out" ;;
          esac
          echo "completion loads in $shell"
        done
        COMPLETIONS

    - name: Scan a simulated AWS with the installed program
      run: |
        export TMPDIR="$RUNNER_TEMP/smoke-shared"
        # As the runner's own user, not root: the files of the scan are then the
        # runner's to read and remove (dry run 7: PermissionError on audit.json),
        # and it is a truer test of a normal user running the package. HOME is
        # the scan's own directory, which smoke_scan.py creates and passes on.
        python scripts/packaging/smoke_scan.py --keep "$RUNNER_TEMP/smoke-keep" -- \
          docker exec -u "$(id -u):$(id -g)" \
            -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION -e AWS_CONFIG_FILE -e AWS_SHARED_CREDENTIALS_FILE \
            -e HOME -e LANG smoke inventag

    - name: Remove the package and check that nothing is left
      run: |
        docker exec -i -e FORMAT smoke bash -s <<'UNINSTALL'
        set -euo pipefail
        case "$FORMAT" in
          deb) dpkg -r inventag ;;
          rpm) dnf remove -y -q inventag ;;
          tar) rm -rf /opt/inventag; rm -f /usr/local/bin/inventag ;;
        esac
        status=0
        while IFS= read -r path; do
          if [ -L "$path" ] || { [ -e "$path" ] && [ ! -d "$path" ]; }; then
            echo "left: $path"; status=1
          fi
        done < /tmp/inventag-files.txt
        if [ -e /opt/inventag ]; then
          echo "left: /opt/inventag"; find /opt/inventag | sed -n 1,20p; status=1
        fi
        # bash remembers the path of a command that ran before; forget it, or
        # command -v names a file that the uninstall removed (dry run 6)
        hash -r
        if command -v inventag; then
          echo "left: inventag is still on the PATH"; status=1
        fi
        exit $status
        UNINSTALL

    - name: Keep the scan evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: smoke-${{ matrix.system }}
        path: ${{ runner.temp }}/smoke-keep
        if-no-files-found: warn
        retention-days: 7

  smoke-macos-arm64:
    name: Smoke (macOS arm64)
    needs: [plan, build-macos-arm64]
    if: needs.plan.outputs.include_macos == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CPU: arm64
    steps:
    - name: Checkout the tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan.outputs.ref }}
        persist-credentials: false

    - name: Download the build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-macos-arm64
        path: ${{ runner.temp }}/artifacts

    - name: Set up Python 3.12 for the moto server
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install moto (the version of requirements-dev.txt)
      run: python -m pip install "moto[server]==5.2.5"

    - name: Unpack, run, check the man page and the completions
      run: |
        mkdir -p "$RUNNER_TEMP/install"
        tar -xzf "$RUNNER_TEMP/artifacts/inventag-${VERSION}-darwin-${CPU}.tar.gz" -C "$RUNNER_TEMP/install"
        BIN="$RUNNER_TEMP/install/inventag"
        test "$(env -i PATH=/usr/bin:/bin "$BIN/inventag" --version)" = "inventag $VERSION"
        env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" "$BIN/inventag" selftest
        # The man page is read from the file (roff source). macOS man has no -l
        # (dry run 7); a name with a slash is a file. Rendering is extra.
        page="$BIN/share/man/man1/inventag.1"
        test -s "$page"
        first=$(sed -n 1p "$page")
        [[ "$first" == ".TH INVENTAG 1 "* ]]
        name=$(sed -n '/^\.SH NAME$/{n;p;}' "$page")
        grep -q '^inventag ' <<<"$name"
        if command -v man > /dev/null && command -v col > /dev/null && rendered=$(man "$page" 2> /dev/null); then
          grep -q -i inventag <<<"$rendered"
        else
          echo "note: man or col is missing or does not render here; the roff file was checked"
        fi
        bash -n "$BIN/share/completions/inventag.bash"
        zsh -n "$BIN/share/completions/_inventag"

    - name: Scan a simulated AWS with the unpacked program
      run: |
        python scripts/packaging/smoke_scan.py --keep "$RUNNER_TEMP/smoke-keep" -- \
          "$RUNNER_TEMP/install/inventag/inventag"

    - name: Remove the directory and check that nothing is left
      run: |
        rm -rf "$RUNNER_TEMP/install"
        test ! -e "$RUNNER_TEMP/install"

    - name: Keep the scan evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: smoke-macos-arm64
        path: ${{ runner.temp }}/smoke-keep
        if-no-files-found: warn
        retention-days: 7

  # The primary install path of the docs (pipx), proven from the wheel of the
  # tag. The wheel is built here from the tagged source; the PyPI file is the
  # same source built by release.yml.
  smoke-pipx:
    name: Smoke (pipx, wheel of the tag)
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
    - name: Checkout the tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan.outputs.ref }}
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Build the wheel, install it with pipx, run it, remove it
      run: |
        python -m pip install "pipx==1.4.3"
        python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
        python -m pipx install "$RUNNER_TEMP"/dist/inventag_aws-"${VERSION}"-py3-none-any.whl
        export PATH="$HOME/.local/bin:$PATH"
        test "$(inventag --version)" = "inventag $VERSION"
        inventag selftest
        python -m pipx uninstall inventag-aws
        # bash remembers the path of a command that ran before; forget it, or
        # command -v names a file that the uninstall removed (dry run 6)
        hash -r
        if command -v inventag; then
          echo "left: inventag is still on the PATH"
          exit 1
        fi

    # The install page says that `uv tool install` gives the same result as
    # pipx (B6 fix 3). uv comes from PyPI, pinned by version and by the sha256
    # of its wheel for this runner (Linux x86_64, glibc); pip refuses any other
    # file. uv installs the wheel of the commit, as pipx did.
    - name: Install the wheel with uv, run it, remove it
      run: |
        cat > "$RUNNER_TEMP/uv-requirements.txt" <<'REQ'
        uv==0.13.9 \
            --hash=sha256:d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19
        REQ
        python -m pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/uv-requirements.txt"
        uv --version
        uv tool install --python "$(command -v python)" "$RUNNER_TEMP"/dist/inventag_aws-"${VERSION}"-py3-none-any.whl
        export PATH="$HOME/.local/bin:$PATH"
        test "$(inventag --version)" = "inventag $VERSION"
        inventag selftest
        uv tool uninstall inventag-aws
        hash -r
        if command -v inventag; then
          echo "left: inventag is still on the PATH"
          exit 1
        fi

  # Checksums, SBOMs and the notices check of every file of the release. It
  # holds read access only, so it can run on a pull request. The attestation
  # is made by the next job, `attest`.
  provenance:
    name: Checksums and SBOMs
    needs:
    - plan
    - build-linux-x86_64
    - build-linux-arm64
    - build-macos-arm64
    - smoke-linux
    - smoke-macos-arm64
    - smoke-pipx
    # With INCLUDE_MACOS off the two macOS jobs are skipped, and a skipped
    # job in `needs` would skip this one too. This runs unless something
    # failed or the run was cancelled; the step below checks the files.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
    - name: Download the files of the builds
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: build-*
        merge-multiple: true
        path: ${{ runner.temp }}/release

    - name: Every expected file of the builds is there
      env:
        VERSION: ${{ needs.plan.outputs.version }}
        INCLUDE_MACOS: ${{ needs.plan.outputs.include_macos }}
      run: |
        cd "$RUNNER_TEMP/release"
        status=0
        want() {
          if ! compgen -G "$1" > /dev/null; then
            echo "::error::Missing file of the builds: $1"
            status=1
          fi
        }
        for cpu in x86_64 arm64; do
          want "inventag-${VERSION}-linux-${cpu}.tar.gz"
          want "inventag-${VERSION}-linux-${cpu}.THIRD-PARTY-LICENSES.txt"
        done
        want 'inventag_*_amd64.deb'
        want 'inventag_*_arm64.deb'
        want 'inventag-*.x86_64.rpm'
        want 'inventag-*.aarch64.rpm'
        if [ "$INCLUDE_MACOS" = true ]; then
          want "inventag-${VERSION}-darwin-arm64.tar.gz"
          want "inventag-${VERSION}-darwin-arm64.THIRD-PARTY-LICENSES.txt"
        elif compgen -G '*darwin*' > /dev/null; then
          echo "::error::macOS files are in the builds although INCLUDE_MACOS is off."
          status=1
        fi
        exit $status

    # Architect review F2: the notices file of a release names where the
    # source of GNU libiconv is. An address is a claim that the source is
    # there, so this job fetches both (the project page and the versioned
    # tarball) and fails the packaging job on any error. The two addresses
    # come from the notices files themselves, one per system.
    - name: The libiconv source addresses of the notices files answer
      shell: bash
      run: |
        set -euo pipefail
        release="$RUNNER_TEMP/release"
        check="$RUNNER_TEMP/libiconv-check"
        mkdir -p "$check"
        : > "$check/urls.txt"
        shopt -s nullglob
        files=("$release"/*.THIRD-PARTY-LICENSES.txt)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::No notices file (THIRD-PARTY-LICENSES.txt) was built."
          exit 1
        fi
        for file in "${files[@]}"; do
          name=$(basename "$file")
          if ! grep -Eq '^ *source: https://www\.gnu\.org/software/libiconv/$' "$file"; then
            echo "::error::$name does not name https://www.gnu.org/software/libiconv/."
            exit 1
          fi
          if ! tarball=$(grep -Eo 'https://ftp\.gnu\.org/pub/gnu/libiconv/libiconv-[0-9]+(\.[0-9]+)*\.tar\.gz' "$file" | sort -u); then
            echo "::error::$name names no versioned libiconv tarball."
            exit 1
          fi
          {
            echo "https://www.gnu.org/software/libiconv/"
            echo "$tarball"
          } >> "$check/urls.txt"
        done
        sort -u "$check/urls.txt" > "$check/unique.txt"
        n=0
        while IFS= read -r url; do
          n=$((n + 1))
          target="$check/download-$n"
          echo "Requesting $url"
          # --retry covers a dropped connection only; an HTTP error fails.
          curl --fail --silent --show-error --location --max-time 120 --retry 3 -o "$target" "$url"
          case "$url" in
            *.tar.gz)
              base=$(basename "$url" .tar.gz)
              tar -tzf "$target" > "$check/list-$n.txt"
              if ! awk -v b="$base/" 'index($0, b) == 1 { found = 1 } END { exit !found }' "$check/list-$n.txt"; then
                echo "::error::$url is not the source tarball of $base."
                exit 1
              fi
              echo "- $url: $(sha256sum "$target" | cut -d' ' -f1)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" ;;
            *)
              echo "- $url: answered" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" ;;
          esac
        done < "$check/unique.txt"
        echo "$n libiconv source address(es) fetched."

    - name: One CycloneDX SBOM per archive, .deb and .rpm
      run: |
        python3 -I - "$RUNNER_TEMP/release" "$VERSION" <<'PY'
        import json
        import re
        import sys
        from pathlib import Path

        release, version = Path(sys.argv[1]), sys.argv[2]
        CPU = re.compile(r"(x86_64|amd64|aarch64|arm64)")
        CPU_NAME = {"x86_64": "x86_64", "amd64": "x86_64", "aarch64": "arm64", "arm64": "arm64"}
        SPDX = re.compile(r"^[A-Za-z0-9.+-]+( (AND|OR|WITH) [A-Za-z0-9.+-]+)*$")


        def components_file(artefact):
            if artefact.name.endswith(".tar.gz"):
                return release / (artefact.name[: -len(".tar.gz")] + ".components.json")
            cpu = CPU_NAME[CPU.search(artefact.name).group(1)]
            return release / f"inventag-{version}-linux-{cpu}.components.json"


        def component(row):
            out = {"type": "library", "name": row["name"]}
            if row.get("version"):
                out["version"] = row["version"]
            licence = row["licence"]
            out["licenses"] = [{"expression": licence} if SPDX.match(licence) else {"license": {"name": licence}}]
            if row["section"] == "package":
                name = re.sub(r"[-_.]+", "-", row["name"]).lower()
                out["purl"] = f"pkg:pypi/{name}@{row['version']}"
            if row.get("files"):
                out["properties"] = [{"name": "inventag:files", "value": ", ".join(sorted(row["files"]))}]
            return out


        artefacts = sorted(p for p in release.iterdir() if p.name.endswith((".tar.gz", ".deb", ".rpm")))
        if not artefacts:
            sys.exit("no archive, .deb or .rpm to describe")
        for artefact in artefacts:
            rows = json.loads(components_file(artefact).read_text(encoding="utf-8"))
            rows.sort(key=lambda r: (r["name"].lower(), r["name"], r.get("version", "")))
            bom = {
                "bomFormat": "CycloneDX",
                "specVersion": "1.5",
                "version": 1,
                "metadata": {
                    "component": {"type": "application", "name": "inventag", "version": version},
                    "properties": [{"name": "inventag:artefact", "value": artefact.name}],
                },
                "components": [component(r) for r in rows],
            }
            out = release / (artefact.name + ".cdx.json")
            out.write_text(json.dumps(bom, indent=2, sort_keys=True) + "\n", encoding="utf-8")
            print(f"wrote {out.name}: {len(rows)} components")
        PY

    - name: Write and check the checksums of every file
      run: |
        cd "$RUNNER_TEMP/release"
        export LC_ALL=C
        find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS.new"
        mv "$RUNNER_TEMP/SHA256SUMS.new" SHA256SUMS
        sha256sum -c SHA256SUMS
        {
          echo "### Files of this release"
          echo
          echo '```'
          cat SHA256SUMS
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the release files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-files
        path: ${{ runner.temp }}/release/*
        if-no-files-found: error
        retention-days: 7

  # Keyless build attestation of the files of the release (the workflow's
  # identity; no key of ours). Users check it with `gh attestation verify`.
  # The only job with id-token and attestations: write, and it never runs on a
  # pull request: a same-repository pull request runs the workflow file of its
  # own branch, so a job it could start would sign files that pass the check
  # in the docs (B6 fix 5). Not run in a dry run: it would sign files that no
  # release carries.
  attest:
    name: Build attestation
    needs: [plan, provenance]
    if: github.event_name != 'pull_request' && needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Download the release files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-files
        path: ${{ runner.temp }}/release

    - name: Check the checksums of the release files
      run: |
        cd "$RUNNER_TEMP/release"
        sha256sum -c SHA256SUMS

    - name: Create the build attestation of the files (keyless)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ runner.temp }}/release/SHA256SUMS

  # The only job that writes to the release. Skipped in a dry run.
  publish:
    name: Attach to the release
    needs: [plan, provenance, attest]
    if: needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
    - name: Download the release files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-files
        path: ${{ runner.temp }}/release

    - name: Upload to the GitHub release of the tag
      run: |
        gh release view "$TAG" > /dev/null
        gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber
        gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/have.txt"
        find "$RUNNER_TEMP/release" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/want.txt"
        missing=$(comm -13 "$RUNNER_TEMP/have.txt" "$RUNNER_TEMP/want.txt")
        if [ -n "$missing" ]; then
          echo "::error::Not on the release after the upload: $missing"
          exit 1
        fi
        echo "$(wc -l < "$RUNNER_TEMP/want.txt") files are on the release $TAG."
