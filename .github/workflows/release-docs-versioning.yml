name: Auto-create Documentation Version on Release

# Runs when a GitHub release is published. It archives the documentation of
# every release tag of the same major line that has no snapshot yet, with the
# same script as the manual "Sync Documentation Versions" job, and shares that
# job's concurrency group so the two never push at the same time.
#
# The released version itself is the current docs (docs/), so it is archived
# by the next release. To repair or re-run, use "Sync Documentation Versions".
on:
  release:
    types: [published]

# GITHUB_TOKEN only reads; the push uses the VERSION_BUMP_WORKFLOW token.
permissions:
  contents: read

concurrency:
  group: sync-doc-versions
  cancel-in-progress: false

jobs:
  archive:
    name: Archive documentation versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Work out the tag pattern
        id: pattern
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $RELEASE_TAG is not vX.Y.Z: nothing to archive"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pattern=^v${BASH_REMATCH[1]}\\.[0-9]+\\.[0-9]+\$" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.pattern.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_WORKFLOW }}

      - name: Setup Node.js
        if: steps.pattern.outputs.skip == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        if: steps.pattern.outputs.skip == 'false'
        working-directory: ./website
        run: npm ci --prefer-offline --no-audit

      - name: Reconcile tags and archived versions
        if: steps.pattern.outputs.skip == 'false'
        env:
          TAG_PATTERN: ${{ steps.pattern.outputs.pattern }}
        run: |
          set -o pipefail
          .github/scripts/sync-doc-versions.sh "$TAG_PATTERN" | tee sync-report.txt

      - name: Build the site
        if: steps.pattern.outputs.skip == 'false'
        working-directory: ./website
        run: npm run build

      - name: Commit and push
        if: steps.pattern.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/versioned_docs website/versioned_sidebars website/versions.json
          if git diff --staged --quiet; then
            echo "Nothing to commit: documentation versions already match the tags."
          else
            git commit -m "docs: archive documentation versions after release $RELEASE_TAG [skip release]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Summary
        if: always()
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "## Documentation versions after release $RELEASE_TAG"
            echo
            echo '```text'
            cat sync-report.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
