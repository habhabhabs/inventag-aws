# Default template for the Word BOM report.
#
# InvenTag uses this structure if you give no --word-template.
# To make your own template:
#   1. python inventag_cli.py --print-default-template word > my_word_template.yaml
#   2. Edit my_word_template.yaml.
#   3. python inventag_cli.py --word-template my_word_template.yaml --validate-templates
#   4. python inventag_cli.py --create-word --word-template my_word_template.yaml
#
# Key reference: docs/user-guides/report-templates.md
#
# Variables for text values: {{ company_name }}, {{ document_title }},
# {{ document_subtitle }}, {{ generated_at }}, {{ generated_date }},
# {{ account_ids }}, {{ account_count }}, {{ total_resources }},
# {{ service_count }}, {{ region_count }}, and the names under "variables".

template_version: "2.0"
format_type: word
name: Default Word BOM template
description: The report structure that InvenTag writes if you give no --word-template.

document:
  title: AWS Resource Inventory - BOM Report
  subtitle: ""

branding:
  company_name: ""

header_footer:
  header_text: ""
  footer_text: ""
  include_page_numbers: false

# The sections appear in the report in this order.
sections:
  - id: title
    content_type: title

  - id: generated_on
    content_type: text
    paragraphs:
      - "Generated on: {{ generated_at }} UTC"

  - id: executive_summary
    content_type: text
    title: Executive Summary
    level: 1
    paragraphs:
      - "Total Resources: {{ total_resources }}"
      - "Services Covered: {{ service_count }}"
      - "AWS Regions: {{ region_count }}"

  - id: service_summary
    content_type: service_summary
    title: Service Summary
    level: 2
    table_style: Light Grid Accent 1
    columns:
      - field: service
        heading: Service
      - field: resource_count
        heading: Resource Count
      - field: percentage
        heading: Percentage

  - id: resource_inventory
    content_type: resources
    title: Detailed Resource Inventory
    level: 1
    # {{ service }}, {{ service_resource_count }} and {{ shown_resource_count }}
    # are valid only in service_title and truncation_note.
    service_title: "{{ service }} Resources ({{ service_resource_count }})"
    table_style: Light List Accent 1
    # "auto" shows a maximum of max_columns fields for each service.
    # To select the columns, write a list, for example:
    #   columns:
    #     - field: name
    #       heading: Resource name
    #       width: 2.0
    #     - field: tags.Owner
    #       heading: Owner
    columns: auto
    max_columns: 6
    max_rows: 50
    truncation_note: "Note: Showing first {{ shown_resource_count }} of {{ service_resource_count }} {{ service }} resources."
    page_break_after_service: true

  - id: report_information
    content_type: text
    title: Report Information
    level: 1
    paragraphs:
      - This report was generated using InvenTag - AWS Resource Inventory Tool
      - "For more information, visit: https://github.com/habhabhabs/inventag-aws"
