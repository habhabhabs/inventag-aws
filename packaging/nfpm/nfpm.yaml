# nfpm configuration for the .deb and .rpm of InvenTag (plan 3.4).
#
# Built by scripts/packaging/build_linux_packages.sh, which runs nfpm in the
# work directory of scripts/packaging/build_binary.sh (it holds dist/inventag/
# and the gzipped man page) with INVENTAG_VERSION (from inventag/_version.py)
# and NFPM_ARCH (amd64 or arm64) set. No version number in this file.
#
# No maintainer script: installing and removing the package changes nothing
# outside the files listed here.
name: inventag
version: ${INVENTAG_VERSION}
arch: ${NFPM_ARCH}
platform: linux
section: utils
priority: optional
maintainer: InvenTag Contributors <https://github.com/habhabhabs/inventag-aws/issues>
vendor: InvenTag Contributors
homepage: https://habhabhabs.github.io/inventag-aws/
license: MIT
description: |-
  Read-only AWS inventory, tag checks and Excel and Word BOM reports.
  A self-contained build: it brings its own Python and libraries in
  /opt/inventag and needs no Python on the system.
  Third-party licences: see THIRD-PARTY-LICENSES.txt in /opt/inventag.

contents:
  - src: ./dist/inventag
    dst: /opt/inventag
    type: tree
  - src: /opt/inventag/inventag
    dst: /usr/bin/inventag
    type: symlink
  - src: ./pkg/inventag.1.gz
    dst: /usr/share/man/man1/inventag.1.gz
    file_info:
      mode: 0644
  - src: ./dist/inventag/share/completions/inventag.bash
    dst: /usr/share/bash-completion/completions/inventag
    file_info:
      mode: 0644
  - src: ./dist/inventag/share/completions/_inventag
    dst: /usr/share/zsh/vendor-completions/_inventag
    packager: deb
    file_info:
      mode: 0644
  - src: ./dist/inventag/share/completions/_inventag
    dst: /usr/share/zsh/site-functions/_inventag
    packager: rpm
    file_info:
      mode: 0644
  - src: ./dist/inventag/share/completions/inventag.fish
    dst: /usr/share/fish/vendor_completions.d/inventag.fish
    file_info:
      mode: 0644
  - src: ./dist/inventag/LICENSE
    dst: /usr/share/doc/inventag/LICENSE
    file_info:
      mode: 0644
  - src: ./dist/inventag/THIRD-PARTY-LICENSES.txt
    dst: /usr/share/doc/inventag/THIRD-PARTY-LICENSES.txt
    file_info:
      mode: 0644
