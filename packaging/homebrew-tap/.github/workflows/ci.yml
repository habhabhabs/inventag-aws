# Checks of the tap: style, audit, install and test of the formula, on an Apple
# Silicon Mac and on Linux x86_64. Nothing here writes to the repository and no
# secret is used. Until Formula/inventag.rb exists (the first release writes
# it), the jobs say so and stop with success.
name: Tap checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Check out the tap
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout, pinned by commit as in the workflows of inventag-aws
      with:
        persist-credentials: false

    - name: Style, audit, install and test
      shell: bash
      run: |
        if [ ! -f Formula/inventag.rb ]; then
          echo "No Formula/inventag.rb yet: the first release writes it."
          exit 0
        fi
        brew tap habhabhabs/inventag "$GITHUB_WORKSPACE"
        brew style habhabhabs/inventag
        brew audit --strict habhabhabs/inventag/inventag
        brew install habhabhabs/inventag/inventag
        brew test habhabhabs/inventag/inventag
        inventag --version
        inventag selftest
        man -w inventag
        # Homebrew may relink or re-sign files in its keg. The lxml modules must be
        # the files of the release archive (the download in Homebrew's cache).
        # Same comparison as check_lxml.sh in the InvenTag repository.
        archive="$(brew --cache --formula habhabhabs/inventag/inventag)"
        keg="$(brew --prefix habhabhabs/inventag/inventag)/libexec"
        work="$(mktemp -d)"
        tar -xzf "$archive" -C "$work" --strip-components=1
        found=0
        status=0
        while IFS= read -r so; do
          found=1
          if [ "$(shasum -a 256 "$work/$so" | cut -d' ' -f1)" = "$(shasum -a 256 "$keg/$so" | cut -d' ' -f1)" ]; then
            echo "ok $so"
          else
            echo "DIFFERENT $so"
            status=1
          fi
        done < <(cd "$work" && find . -type f -path '*/lxml/*' -name '*.so' | sort)
        rm -rf "$work"
        [ "$found" = 1 ] || { echo "the archive has no lxml module to compare"; exit 1; }
        [ "$status" = 0 ] || { echo "Homebrew changed an lxml module: report it to the InvenTag maintainers"; exit 1; }
        brew uninstall inventag

  formula-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out the tap
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout, pinned by commit as in the workflows of inventag-aws
      with:
        persist-credentials: false

    - name: Style, audit, install and test
      shell: bash
      run: |
        if [ ! -f Formula/inventag.rb ]; then
          echo "No Formula/inventag.rb yet: the first release writes it."
          exit 0
        fi
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew tap habhabhabs/inventag "$GITHUB_WORKSPACE"
        brew style habhabhabs/inventag
        brew audit --strict habhabhabs/inventag/inventag
        brew install habhabhabs/inventag/inventag
        brew test habhabhabs/inventag/inventag
        inventag --version
        inventag selftest
        # Homebrew may relink or re-sign files in its keg. The lxml modules must be
        # the files of the release archive (the download in Homebrew's cache).
        # Same comparison as check_lxml.sh in the InvenTag repository.
        archive="$(brew --cache --formula habhabhabs/inventag/inventag)"
        keg="$(brew --prefix habhabhabs/inventag/inventag)/libexec"
        work="$(mktemp -d)"
        tar -xzf "$archive" -C "$work" --strip-components=1
        found=0
        status=0
        while IFS= read -r so; do
          found=1
          if [ "$(sha256sum "$work/$so" | cut -d' ' -f1)" = "$(sha256sum "$keg/$so" | cut -d' ' -f1)" ]; then
            echo "ok $so"
          else
            echo "DIFFERENT $so"
            status=1
          fi
        done < <(cd "$work" && find . -type f -path '*/lxml/*' -name '*.so' | sort)
        rm -rf "$work"
        [ "$found" = 1 ] || { echo "the archive has no lxml module to compare"; exit 1; }
        [ "$status" = 0 ] || { echo "Homebrew changed an lxml module: report it to the InvenTag maintainers"; exit 1; }
        brew uninstall inventag
