[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -m "not performance"
markers =
    performance: performance benchmarks (run with -m performance)
    e2e: whole-CLI runs against moto (slower; select with -m e2e)
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
