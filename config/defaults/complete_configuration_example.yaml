# BOM processing settings for --bom-config
# Every key below is one InvenTag reads; the values are its defaults, except the two
# file paths, which point at the shipped examples (run from the repository root).
# --bom-config holds no report layout: --word-template and --excel-template select a template.

enable_network_analysis: true
enable_security_analysis: true
enable_service_enrichment: true
enable_service_descriptions: true
enable_tag_mapping: true
enable_cost_analysis: false
enable_parallel_processing: true
max_worker_threads: 4
cache_results: true
processing_timeout: 300

service_descriptions_config: "config/defaults/services/service_descriptions_example.yaml"
tag_mappings_config: "config/defaults/mappings/tag_to_column_mappings_example.yaml"
